<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>어비스 딜버</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100dvh}
  body{margin:0;background:#0e0f13;color:#d9dee8;
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       display:flex;flex-direction:column;align-items:center;
       overflow:hidden;overscroll-behavior:none;
       -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
       font-variant-numeric:tabular-nums}
  #app{display:flex;flex-direction:column;width:100%;max-width:520px;height:100%;
       padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}

  /* ---- 상단 지표 ---- */
  #top{flex:none;display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .chip{flex:1;background:#171a21;border:1px solid #262b36;border-radius:6px;padding:5px 8px;
        display:flex;flex-direction:column;gap:1px;min-width:0}
  .chip .k{font-size:10px;letter-spacing:1px;color:#7c8698}
  .chip .v{font-size:16px;color:#f2f5fa;overflow:hidden;text-overflow:ellipsis}
  #goldv{color:#ffc857}

  /* 더보기 — 설정·랭킹처럼 자주 안 쓰는 것을 넣는다 */
  #more{position:relative;flex:none;width:42px;align-self:stretch;display:flex;
        flex-direction:column;align-items:center;justify-content:center;gap:4px;
        background:#171a21;border:1px solid #262b36;border-radius:6px;cursor:pointer}
  #more span{display:block;width:17px;height:2px;background:#9aa4b6;border-radius:2px}
  #more:hover span{background:#d9dee8}
  #morebadge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;
             border-radius:99px;background:#e2553f;color:#fff;font-size:10px;font-weight:700;
             display:grid;place-items:center;padding:0 4px}

  #xpwrap{flex:none;margin-bottom:10px}
  #xprow{display:flex;justify-content:space-between;font-size:11px;color:#8b93a5;margin-bottom:3px}
  .track{height:8px;background:#171a21;border:1px solid #262b36;border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;width:0;transition:width .15s linear}
  #xpbar i{background:linear-gradient(90deg,#3b82f6,#7dd3fc)}

  /* ---- 전투 무대 ---- */
  #stage{flex:1;position:relative;min-height:190px;background:#12141a;
         border:1px solid #262b36;border-radius:8px;overflow:hidden;
         display:flex;flex-direction:column}
  #arena{flex:1;position:relative;min-height:0;cursor:pointer;touch-action:manipulation}
  #view{display:block;width:100%;height:100%}
  #float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dmg{position:absolute;font-size:15px;font-weight:700;color:#ffe9a8;
       text-shadow:0 1px 3px #000;animation:rise .8s ease-out forwards;white-space:nowrap}
  .dmg.crit{font-size:20px;color:#ff9f4d}
  @keyframes rise{to{transform:translateY(-46px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.dmg{animation:none;opacity:0}}

  #mon{flex:none;padding:7px 10px 9px;border-top:1px solid #232935;background:#151821}
  #monrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  #monname{color:#e8edf5}
  #monhpv{color:#9aa4b6}
  #hpbar{height:11px}
  #hpbar i{background:linear-gradient(90deg,#c0392b,#e2553f)}
  #hpbar.brute i{background:linear-gradient(90deg,#c96a12,#ff9c3a)}
  #hpbar.boss i{background:linear-gradient(90deg,#8e44c8,#c86bff)}

  /* ---- 탭 ---- */
  #tabs{flex:none;display:flex;gap:6px;margin:10px 0 8px}
  #tabs button{position:relative;flex:1;font:inherit;font-size:13px;padding:8px 0;color:#98a2b3;
               background:#171a21;border:1px solid #262b36;border-radius:6px;cursor:pointer}
  #tabs b{position:absolute;top:3px;right:6px;min-width:15px;height:15px;border-radius:99px;
          background:#e2553f;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  /* 퀘스트 진행 막대 */
  .qbar{height:6px;margin-top:5px;background:#20242e;border-radius:99px;overflow:hidden}
  .qbar i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#7dd3fc)}
  .qbar.full i{background:linear-gradient(90deg,#3fa96a,#7ee08a)}
  .row button.claim{background:#2f4a2f;border-color:#3f6b3f}
  #tabs button[aria-selected="true"]{background:#2b3446;color:#fff;border-color:#4a5a75;
                                     box-shadow:inset 0 -2px 0 #6a8cc4}
  /* 내용이 적으면 줄어들어 전투 화면에 자리를 내준다. 고정 높이면 짧은 화면에서 무대가 눌린다 */
  #panel{flex:0 1 auto;max-height:42%;overflow-y:auto;overscroll-behavior:contain}

  .row{display:flex;align-items:center;gap:9px;background:#171a21;border:1px solid #262b36;
       border-radius:6px;padding:8px 10px;margin-bottom:6px}
  .row .grow{flex:1;min-width:0}
  .row .name{font-size:13px;color:#e8edf5}
  .row .sub{font-size:11px;color:#7c8698}
  .row .gain{font-size:11px;color:#7ee08a}
  .row .gain.down{color:#7c8698}
  .row button{font:inherit;font-size:12px;padding:7px 11px;border-radius:5px;cursor:pointer;
              background:#2b3242;color:#e8edf5;border:1px solid #3b455a;white-space:nowrap}
  .row button:disabled{opacity:.4;cursor:default}
  .row button.buy{background:#2f4a2f;border-color:#3f6b3f}
  .row button.sell{background:#3a2a2a;border-color:#5a3a3a}
  .cost{color:#ffc857;font-size:12px}

  .empty{color:#6b7484;font-size:12px;text-align:center;padding:26px 10px}

  .tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid currentColor}
  .slotname{font-size:11px;color:#8b93a5;min-width:34px}

  /* ---- 오프라인 안내 ---- */
  #modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:9}
  #modalbox{background:#151821;border:1px solid #303748;border-radius:10px;padding:18px 20px;
            max-width:340px;width:100%;text-align:center}
  #modalbox h2{margin:0 0 4px;font-size:16px;color:#f2f5fa}
  #modalbox p{margin:0 0 12px;font-size:12px;color:#8b93a5}
  #modalbox .gain{display:flex;justify-content:center;gap:18px;margin-bottom:14px;font-size:14px}
  #modalbox button{font:inherit;width:100%;padding:9px;border-radius:6px;cursor:pointer;
                   background:#2f4a2f;color:#e8edf5;border:1px solid #3f6b3f}
  /* 처치 보상이 몬스터 자리에서 위쪽 지표로 날아간다 */
  .fly{position:absolute;font-size:13px;font-weight:700;pointer-events:none;
       text-shadow:0 1px 3px #000;transition:transform .55s cubic-bezier(.4,.1,.5,1),opacity .55s}
  .fly.gold{color:#ffc857}
  .fly.xp{color:#7dd3fc}

  /* 스테이지·보스 배너 */
  #banner{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;
          opacity:0;transition:opacity .3s,transform .3s;transform:scale(.85)}
  #banner.show{opacity:1;transform:scale(1)}
  #banner .big{font-size:clamp(20px,6vw,30px);font-weight:700;color:#fff;
               text-shadow:0 2px 10px #000,0 0 22px currentColor;letter-spacing:2px}
  #banner .sub{font-size:12px;color:#c3cbd9;margin-top:3px}
  #banner.boss .big{color:#ffb02e}
  #banner.mile .big{color:#7dd3fc}

  /* 레벨업 — 오른 수치를 같이 보여 준다 */
  #lvup{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) translateY(6px);
        background:#161b26f2;border:1px solid #3d4c66;border-radius:8px;padding:10px 14px;
        min-width:190px;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
  #lvup.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #lvup h3{margin:0 0 6px;font-size:14px;color:#ffd166;text-align:center;letter-spacing:1px}
  #lvup dl{margin:0;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:12px}
  #lvup dt{color:#8b93a5}
  #lvup dd{margin:0;text-align:right;color:#f2f5fa}
  #lvup .up{color:#7ee08a;font-size:11px}

  /* 더보기 시트 — 모바일에서 엄지가 닿게 아래에서 올라온다 */
  #sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;
         justify-content:center;z-index:10}
  #sheetbox{width:100%;max-width:520px;max-height:78dvh;display:flex;flex-direction:column;
            background:#141821;border:1px solid #2c3342;border-radius:12px 12px 0 0;
            padding-bottom:env(safe-area-inset-bottom)}
  #sheethead{flex:none;display:flex;align-items:center;justify-content:space-between;
             padding:12px 14px;border-bottom:1px solid #232a37}
  #sheethead b{font-size:15px;color:#f2f5fa}
  #sheetclose{font:inherit;font-size:15px;width:32px;height:32px;border-radius:6px;cursor:pointer;
              background:#1e2430;color:#9aa4b6;border:1px solid #2f3746}
  #sheetbody{flex:1;overflow-y:auto;padding:12px 14px 18px}
  .menu{display:flex;flex-direction:column;gap:8px}
  .menu button{font:inherit;font-size:14px;text-align:left;padding:13px 14px;border-radius:8px;
               cursor:pointer;background:#1a1f2a;color:#e8edf5;border:1px solid #2b3342;
               display:flex;justify-content:space-between;align-items:center;gap:10px}
  .menu button:disabled{opacity:.55;cursor:default}
  .menu .hint{font-size:11px;color:#7c8698}
  .sec{margin-bottom:16px}
  .sec h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:#7c8698}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;
       padding:11px 12px;background:#1a1f2a;border:1px solid #2b3342;border-radius:8px;margin-bottom:7px}
  .opt .lb{font-size:13px;color:#e8edf5}
  .opt .lb small{display:block;font-size:11px;color:#7c8698;margin-top:1px}
  .sw{flex:none;width:44px;height:25px;border-radius:99px;background:#2b3342;border:1px solid #39425420;
      position:relative;cursor:pointer;transition:background .15s}
  .sw[aria-checked="true"]{background:#3fa96a}
  .sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
        background:#e8edf5;transition:transform .15s}
  .sw[aria-checked="true"] i{transform:translateX(19px)}
  .stat{display:flex;justify-content:space-between;padding:9px 12px;background:#1a1f2a;
        border:1px solid #2b3342;border-radius:8px;margin-bottom:6px;font-size:13px}
  .stat span:last-child{color:#f2f5fa}
  .locked{padding:22px 14px;text-align:center;color:#7c8698;font-size:12px;line-height:1.8}
  .danger{background:#3a2226!important;border-color:#5c3138!important;color:#ffb4b4!important}

  #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
         background:#1b1f2a;border:1px solid #333b4d;border-radius:6px;padding:7px 14px;
         font-size:13px;color:#e8edf5;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8}
  #toast.show{opacity:1}
</style>

<div id="app">
  <div id="top">
    <div class="chip"><span class="k">스테이지</span><span class="v" id="stagev">1</span></div>
    <div class="chip"><span class="k">골드</span><span class="v" id="goldv">0</span></div>
    <div class="chip"><span class="k">초당 피해</span><span class="v" id="dpsv">0</span></div>
    <button id="more" type="button" aria-label="더보기" aria-haspopup="dialog">
      <span></span><span></span><span></span>
      <b id="morebadge" hidden></b>
    </button>
  </div>

  <div id="xpwrap">
    <div id="xprow"><span>레벨 <b id="lvv">1</b></span><span id="xpv">0 / 0</span></div>
    <div class="track" id="xpbar"><i></i></div>
  </div>

  <div id="stage">
    <div id="arena">
      <canvas id="view"></canvas>
      <div id="float"></div>
      <div id="banner"><div class="big"></div><div class="sub"></div></div>
      <div id="lvup">
        <h3></h3>
        <dl>
          <dt>공격력</dt><dd id="lu-atk">0</dd>
          <dt>초당 피해</dt><dd id="lu-dps">0</dd>
          <dt>치명타</dt><dd id="lu-crit">0%</dd>
        </dl>
      </div>
    </div>
    <div id="mon">
      <div id="monrow"><span id="monname">임프</span><span id="monhpv">0 / 0</span></div>
      <div class="track" id="hpbar"><i></i></div>
    </div>
  </div>

  <div id="tabs">
    <button id="t-up" aria-selected="true" type="button">강화</button>
    <button id="t-gear" aria-selected="false" type="button">장비</button>
    <button id="t-bag" aria-selected="false" type="button">가방</button>
    <button id="t-quest" aria-selected="false" type="button">퀘스트<b id="questbadge" hidden></b></button>
  </div>
  <div id="panel"></div>
</div>

<div id="sheet" hidden>
  <div id="sheetbox" role="dialog" aria-label="더보기">
    <div id="sheethead">
      <b id="sheettitle">더보기</b>
      <button id="sheetclose" type="button" aria-label="닫기">✕</button>
    </div>
    <div id="sheetbody"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modal" hidden>
  <div id="modalbox">
    <h2>다녀왔구나</h2>
    <p id="awaytime">자리를 비운 사이의 보상</p>
    <div class="gain">
      <span>골드 <b id="offgold" style="color:#ffc857">0</b></span>
      <span>경험치 <b id="offxp" style="color:#7dd3fc">0</b></span>
    </div>
    <button id="offok" type="button">받기</button>
  </div>
</div>

<script src="core.js"></script>
<script src="game.js"></script>
