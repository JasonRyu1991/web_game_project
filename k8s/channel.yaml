# 채널 = 파드 1개 = 정원 5명(core.js CHANNEL_CAP).
#
# Deployment 가 아니라 StatefulSet 인 이유:
#   Deployment 는 파드 이름이 랜덤(channel-7f3k2)이라 "3번 채널로 이동" 을 할 수가 없다.
#   StatefulSet 은 이름이 channel-0, channel-1 로 고정되고 파드마다
#   statefulset.kubernetes.io/pod-name 라벨이 자동으로 붙어서, 그 라벨로
#   파드 하나만 고르는 Service 를 만들 수 있다. 이게 채널 지정 접속의 근거다.
#
# 드레인 설계(이 프로젝트의 명제):
#   1) terminationGracePeriodSeconds(660) > server.js DRAIN_TIMEOUT_SEC(600)
#      → SIGTERM 받고 접속자 넘기는 동안 k8s 가 SIGKILL 하지 않는다.
#   2) readinessProbe 가 /healthz 를 본다 → 드레인 중(503)이면 엔드포인트에서 빠져
#      신규 트래픽이 끊긴다. GKE 컨테이너 네이티브 LB 는 이 readinessProbe 를
#      그대로 LB 헬스체크로 삼는다(ingress.yaml 의 BackendConfig 로 명시도 해둠).
#   3) livenessProbe 는 TCP 로만 본다 → 드레인 중 503 을 "죽었다"고 오해해서
#      파드를 죽여버리는 사고를 막는다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: channel
  labels: { app: channel }
spec:
  serviceName: channel          # 아래 헤드리스 Service. StatefulSet 필수 항목
  replicas: 2                   # 이관 데모의 최소값(보낼 곳이 있어야 하므로 2).
                                # KEDA 붙으면 이건 시작값일 뿐이다.
  selector:
    matchLabels: { app: channel }
  template:
    metadata:
      labels: { app: channel }
    spec:
      terminationGracePeriodSeconds: 660
      containers:
        - name: channel
          image: asia-northeast3-docker.pkg.dev/personal-webgame-project/web-game-images/web-game:v1.2
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CHANNEL_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }   # channel-0 / channel-1
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
# 헤드리스 Service. StatefulSet 이 요구하는 짝이고, 클러스터 내부에서
# channel-0.channel 같은 고정 DNS 이름을 만들어 준다.
# (브라우저는 클러스터 밖이라 이 이름을 못 쓴다 — 그래서 아래 파드별 Service + Ingress 가 필요하다)
apiVersion: v1
kind: Service
metadata:
  name: channel
spec:
  clusterIP: None
  selector: { app: channel }
  ports:
    - port: 8080
      targetPort: 8080
---
# 파드별 Service — 여기가 "채널 지정 접속" 의 핵심.
# selector 가 app:channel 이 아니라 pod-name 이라, 이 Service 는 파드 딱 하나만 가리킨다.
#
# ponytail: 채널 수만큼 Service 를 손으로 늘려야 한다. KEDA 가 3개 이상으로
#   스케일아웃하면 새 파드는 외부에서 닿을 주소가 없다(Redis 채널 명부에는 뜨지만 접속 불가).
#   동적으로 하려면 matchmaker 가 WS 를 프록시하는 구조(A안)로 가야 한다.
#   2채널 데모까지는 이걸로 충분.
apiVersion: v1
kind: Service
metadata:
  name: channel-0
  annotations:
    cloud.google.com/neg: '{"ingress": true}'                        # 컨테이너 네이티브 LB(파드로 직결)
    cloud.google.com/backend-config: '{"default": "channel-backend"}'
spec:
  selector:
    statefulset.kubernetes.io/pod-name: channel-0
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: channel-1
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "channel-backend"}'
spec:
  selector:
    statefulset.kubernetes.io/pod-name: channel-1
  ports:
    - port: 8080
      targetPort: 8080
